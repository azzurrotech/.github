version: '3.8'

services:
  atp:
    build: ./atp
    ports:
      - "8080:8080"
    networks:
      - azzurro-net

  pod:
    build: ./pod
    ports:
      - "8081:8080"
    volumes:
      - pod_data:/app/data
    networks:
      - azzurro-net

  shepherd:
    build: ./shepherd
    ports:
      - "8082:8082"
    networks:
      - azzurro-net

  song:
    build: ./song
    ports:
      - "8083:8083"
    networks:
      - azzurro-net

  stenella:
    build: ./stenella
    ports:
      - "8084:8084"
    networks:
      - azzurro-net

  vici:
    build: ./vici
    ports:
      - "8085:8083"
    networks:
      - azzurro-net

  vidi:
    build: ./vidi
    ports:
      - "8086:8086"
    networks:
      - azzurro-net

  veni:
    build: ./veni
    ports:
      - "8087:8087"
    networks:
      - azzurro-net

  vini:
    build: ./vini
    ports:
      - "8088:8088"
    networks:
      - azzurro-net

  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - atp
      - pod
      - shepherd
      - song
      - stenella
      - vici
      - vidi
      - veni
      - vini
    networks:
      - azzurro-net

networks:
  azzurro-net:
    driver: bridge

volumes:
  pod_data:
